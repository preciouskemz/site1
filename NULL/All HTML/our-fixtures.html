<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Fixtures — Ahudiyannem FC</title>
    <link rel="icon" href="../All Asset/assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
}
.page-header {
    position: relative;
    padding: 60px 5% 40px;
    text-align: center;
    background: linear-gradient(135deg, #0d1a0f 0%, #0a0a0a 50%, #0d0d1a 100%);
    border-bottom: 1px solid rgba(34,197,94,0.15);
}
.page-header h1 {
    font-family: 'Saira', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 40px rgba(34,197,94,0.3);
}
.page-header p {
    color: rgba(255,255,255,0.6);
    margin-top: 10px;
    font-size: 1rem;
}
.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 20px;
    transition: color 0.3s;
}
.back-link:hover { color: #22c55e; }
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 5%;
}
.stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 50px;
}
.stat-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(34,197,94,0.12);
    padding: 30px 20px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
}
.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(34,197,94,0.1);
    border-color: rgba(34,197,94,0.3);
}
.stat-number {
    font-family: 'Saira', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #22c55e;
}
.stat-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
}
.filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}
.filter-btn {
    padding: 10px 24px;
    border: 1px solid rgba(34,197,94,0.2);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.6);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
}
.filter-btn.active, .filter-btn:hover {
    background: #22c55e;
    color: #fff;
    border-color: #22c55e;
}
.fixtures-table {
    width: 100%;
    border-collapse: collapse;
}
.fixtures-table thead th {
    padding: 14px 16px;
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-weight: 700;
}
.fixtures-table tbody tr {
    transition: background 0.3s;
}
.fixtures-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.fixtures-table tbody tr:hover { background: rgba(34,197,94,0.06); }
.fixtures-table tbody td {
    padding: 14px 16px;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.8);
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.fixtures-table .fixture-badge {
    display: inline-block;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
}
.fixtures-table .fixture-badge.home { background: rgba(34,197,94,0.15); color: #22c55e; }
.fixtures-table .fixture-badge.away { background: rgba(59,130,246,0.15); color: #60a5fa; }
.page-footer {
    text-align: center;
    padding: 40px 5%;
    border-top: 1px solid rgba(255,255,255,0.06);
}
.page-footer a {
    color: #22c55e;
    text-decoration: none;
    font-size: 0.85rem;
}
.page-footer a:hover { text-decoration: underline; }
@media (max-width: 768px) {
    .page-header h1 { font-size: 2rem; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .stat-number { font-size: 2rem; }
    .fixtures-table thead th, .fixtures-table tbody td { padding: 10px 8px; font-size: 0.75rem; }
}
</style>
</head>
<body>

<header class="page-header">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <h1>Our Fixtures</h1>
    <p>Upcoming battles — mark your calendar and come support the team.</p>
</header>

<div class="container">

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number">10</div>
            <div class="stat-label">Upcoming Matches</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">5</div>
            <div class="stat-label">Home Games</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">5</div>
            <div class="stat-label">Away Games</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">2</div>
            <div class="stat-label">League Comp.</div>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterFixtures('all')">All</button>
        <button class="filter-btn" onclick="filterFixtures('mens')">Men's Team</button>
        <button class="filter-btn" onclick="filterFixtures('womens')">Queens</button>
        <button class="filter-btn" onclick="filterFixtures('home')">Home</button>
    </div>

    <table class="fixtures-table" id="fixturesTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>League</th>
                <th>Home</th>
                <th></th>
                <th>Away</th>
                <th>Venue</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody id="fixturesBody"></tbody>
    </table>

</div>

<footer class="page-footer">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Ahudiyannem FC</a>
</footer>

<script>
const fixturesData = [
    { date: '07 Jun 2026', time: '4:00 PM', league: 'NLO Abia Centre', home: 'Ahudiyannem FC', away: 'Abia Warriors FA', venue: 'Ubakala Mini Stadium', type: 'home', team: 'mens' },
    { date: '08 Jun 2026', time: '2:00 PM', league: 'NWFL Premiership', home: 'Ahudiyannem Queens', away: 'Bayelsa Queens', venue: 'Umuahia Township Stadium', type: 'home', team: 'womens' },
    { date: '14 Jun 2026', time: '4:00 PM', league: 'NLO Abia Centre', home: 'Diamond FA', away: 'Ahudiyannem FC', venue: 'Okigwe Township Stadium', type: 'away', team: 'mens' },
    { date: '15 Jun 2026', time: '4:00 PM', league: 'NWFL Premiership', home: 'Edo Queens', away: 'Ahudiyannem Queens', venue: 'Samuel Ogbemudia Stadium', type: 'away', team: 'womens' },
    { date: '21 Jun 2026', time: '3:00 PM', league: 'NLO Abia Centre', home: 'Ahudiyannem FC', away: 'Bendel FA', venue: 'Umuahia Township Stadium', type: 'home', team: 'mens' },
    { date: '22 Jun 2026', time: '2:00 PM', league: 'NWFL Premiership', home: 'Ahudiyannem Queens', away: 'Rivers Angels', venue: 'Umuahia Township Stadium', type: 'home', team: 'womens' },
    { date: '28 Jun 2026', time: '4:00 PM', league: 'NLO Abia Centre', home: 'Ahudiyannem FC', away: 'Golden FA', venue: 'Ubakala Mini Stadium', type: 'home', team: 'mens' },
    { date: '29 Jun 2026', time: '4:00 PM', league: 'NWFL Premiership', home: 'Confluence Queens', away: 'Ahudiyannem Queens', venue: 'Confluence Stadium', type: 'away', team: 'womens' },
    { date: '05 Jul 2026', time: '3:00 PM', league: 'NLO Abia Centre', home: 'City FC', away: 'Ahudiyannem FC', venue: 'Aba Township Stadium', type: 'away', team: 'mens' },
    { date: '06 Jul 2026', time: '2:00 PM', league: 'NWFL Premiership', home: 'Ahudiyannem Queens', away: 'Nasarawa Amazons', venue: 'Umuahia Township Stadium', type: 'home', team: 'womens' },
];

function renderFixtures(data) {
    const tbody = document.getElementById('fixturesBody');
    tbody.innerHTML = data.map(m => {
        const isHome = m.type === 'home';
        return `
        <tr>
            <td>${m.date}</td>
            <td>${m.league}</td>
            <td style="font-weight:${m.home.includes('Ahudiyannem') ? '700' : '400'}; color:${m.home.includes('Ahudiyannem') ? '#22c55e' : 'rgba(255,255,255,0.8)'}">${m.home}</td>
            <td style="text-align:center; font-weight:900; color:rgba(34,197,94,0.4);">VS</td>
            <td style="font-weight:${m.away.includes('Ahudiyannem') ? '700' : '400'}; color:${m.away.includes('Ahudiyannem') ? '#22c55e' : 'rgba(255,255,255,0.8)'}">${m.away}</td>
            <td>${m.venue}</td>
            <td><span class="fixture-badge ${m.type}">${isHome ? 'HOME' : 'AWAY'}</span></td>
        </tr>`;
    }).join('');
}

function filterFixtures(filter) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    let filtered = fixturesData;
    if (filter === 'mens') filtered = fixturesData.filter(m => m.team === 'mens');
    else if (filter === 'womens') filtered = fixturesData.filter(m => m.team === 'womens');
    else if (filter === 'home') filtered = fixturesData.filter(m => m.type === 'home');
    renderFixtures(filtered);
}

renderFixtures(fixturesData);
</script>

</body>
</html>
