<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Men's Team — Ahudiyannem FC</title>
    <link rel="icon" href="../All Asset/assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
}
.page-header {
    padding: 50px 5% 30px;
    text-align: center;
    background: linear-gradient(135deg, #0a2e1f, #064e3b, #0d3b3a, #0f172a);
    border-bottom: 1px solid rgba(34,197,94,0.15);
}
.page-header h1 {
    font-family: 'Saira', sans-serif;
    font-size: 3rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #22c55e, #0d9488);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.page-header p {
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
    font-size: 0.9rem;
}
.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 16px;
    transition: color 0.3s;
}
.back-link:hover { color: #22c55e; }
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 5%;
}
.tab-bar {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 40px;
    border-radius: 50px;
    overflow: hidden;
    border: 1px solid rgba(34,197,94,0.2);
    background: rgba(255,255,255,0.04);
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}
.tab-btn {
    padding: 14px 36px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.5);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
}
.tab-btn:not(:last-child) { border-right: 1px solid rgba(34,197,94,0.1); }
.tab-btn.active {
    background: #22c55e;
    color: #fff;
    box-shadow: 0 4px 15px rgba(34,197,94,0.3);
}
.tab-btn:hover:not(.active) { color: #fff; }
.team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
}
.member-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 30px 24px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.member-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(34,197,94,0.08);
    border-color: rgba(34,197,94,0.2);
}
.member-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, rgba(34,197,94,0.2), rgba(13,148,136,0.1));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    color: #22c55e;
    border: 2px solid rgba(34,197,94,0.2);
}
.member-name {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 4px;
}
.member-role {
    font-size: 0.8rem;
    color: #22c55e;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}
.member-detail {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    line-height: 1.5;
}
.page-footer {
    text-align: center;
    padding: 40px 5%;
    border-top: 1px solid rgba(255,255,255,0.06);
}
.page-footer a { color: #22c55e; text-decoration: none; font-size: 0.85rem; }
.page-footer a:hover { text-decoration: underline; }
@media (max-width: 900px) {
    .team-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
    .page-header { padding: 40px 5% 24px; }
    .page-header h1 { font-size: 2rem; letter-spacing: 2px; }
    .page-header p { font-size: 0.8rem; }
    .container { padding: 28px 4%; }
    .tab-bar { flex-direction: column; border-radius: 12px; width: 100%; }
    .tab-btn:not(:last-child) { border-right: none; border-bottom: 1px solid rgba(34,197,94,0.1); }
    .tab-btn { padding: 14px 20px; font-size: 0.8rem; }
    .team-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .member-card { padding: 24px 16px; }
    .member-avatar { width: 72px; height: 72px; font-size: 1.8rem; }
    .member-name { font-size: 1rem; }
    .member-role { font-size: 0.7rem; letter-spacing: 0.5px; }
    .member-detail { font-size: 0.75rem; }
    .page-footer { padding: 28px 5%; }
}
@media (max-width: 480px) {
    .page-header { padding: 32px 4% 20px; }
    .page-header h1 { font-size: 1.5rem; letter-spacing: 1px; }
    .container { padding: 20px 4%; }
    .tab-bar { margin-bottom: 24px; }
    .tab-btn { padding: 12px 16px; font-size: 0.75rem; }
    .team-grid { grid-template-columns: 1fr; gap: 12px; }
    .member-card { padding: 20px 14px; }
    .member-avatar { width: 64px; height: 64px; font-size: 1.5rem; margin-bottom: 14px; }
    .member-name { font-size: 0.95rem; }
    .member-detail { font-size: 0.7rem; }
    .back-link { font-size: 0.75rem; }
    .page-footer { padding: 24px 4%; }
}
@media (max-width: 360px) {
    .page-header h1 { font-size: 1.2rem; }
    .tab-btn { padding: 10px 12px; font-size: 0.7rem; }
    .member-card { padding: 16px 10px; }
    .member-avatar { width: 56px; height: 56px; font-size: 1.3rem; }
}
</style>
</head>
<body>

<header class="page-header">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <h1>AHUDIYANNEM FC</h1>
    <p>Men's senior squad — NLO 2026 season</p>
</header>

<div class="container">
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('players')">Players</button>
        <button class="tab-btn" onclick="switchTab('staff')">Coaching Crew</button>
    </div>

    <div class="team-grid" id="playersTab">
        <!-- populated by JS -->
    </div>
    <div class="team-grid" id="staffTab" style="display:none;">
        <!-- populated by JS -->
    </div>
</div>

<footer class="page-footer">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Ahudiyannem FC</a>
</footer>

<script>
const players = [
    { name: 'Chibueze Okonkwo', role: 'Goalkeeper', detail: 'Age 24 · 6\'2" · 15 caps' },
    { name: 'Emeka Nwosu', role: 'Goalkeeper', detail: 'Age 22 · 6\'1" · 8 caps' },
    { name: 'Chinedu Eze', role: 'Right Back', detail: 'Age 25 · 5\'10" · 28 caps' },
    { name: 'Somtochi Okafor', role: 'Centre Back', detail: 'Age 23 · 6\'3" · 22 caps' },
    { name: 'Ifeanyi Obi', role: 'Centre Back', detail: 'Age 26 · 6\'2" · 31 caps' },
    { name: 'Kelechi Nnamdi', role: 'Left Back', detail: 'Age 21 · 5\'9" · 12 caps' },
    { name: 'David Uche', role: 'Defensive Mid', detail: 'Age 24 · 5\'11" · 19 caps' },
    { name: 'Chisom Amaechi', role: 'Central Mid', detail: 'Age 23 · 5\'10" · 25 caps' },
    { name: 'Obinna Ugwu', role: 'Attacking Mid', detail: 'Age 22 · 5\'9" · 18 caps' },
    { name: 'Nnamdi Azikiwe', role: 'Right Wing', detail: 'Age 24 · 5\'8" · 20 caps' },
    { name: 'Chidera Eke', role: 'Left Wing', detail: 'Age 21 · 5\'7" · 14 caps' },
    { name: 'Victor Ani', role: 'Striker', detail: 'Age 25 · 6\'0" · 30 caps · 12 goals' },
    { name: 'Ugochukwu Mba', role: 'Striker', detail: 'Age 23 · 6\'1" · 16 caps · 8 goals' },
    { name: 'Solomon Adeyemi', role: 'Forward', detail: 'Age 20 · 5\'10" · 10 caps · 4 goals' },
];

const staff = [
    { name: 'Coach Emeka Otu', role: 'Head Coach', detail: 'UEFA B License · 8 years experience' },
    { name: 'Ambrose Nwankwo', role: 'Assistant Coach', detail: 'NFF License · 5 years experience' },
    { name: 'Dr. Kelechi Ibe', role: 'Team Doctor', detail: 'MBBS · Sports Medicine' },
    { name: 'Chuka Madu', role: 'Goalkeeper Coach', detail: 'Former NPFL Goalkeeper' },
    { name: 'Ifeanyi Okpara', role: 'Fitness Trainer', detail: 'Certified Strength & Conditioning' },
    { name: 'Emeka Udeh', role: 'Team Manager', detail: 'Administration & Logistics' },
    { name: 'Obinna Nwachukwu', role: 'Video Analyst', detail: 'Tactical Analysis & Scouting' },
    { name: 'Chidi Okafor', role: 'Kit Manager', detail: 'Equipment & Apparel' },
];

function renderCards(data, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = data.map(m => `
        <div class="member-card">
            <div class="member-avatar"><i class="fas fa-user"></i></div>
            <div class="member-name">${m.name}</div>
            <div class="member-role">${m.role}</div>
            <div class="member-detail">${m.detail}</div>
        </div>
    `).join('');
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (tab === 'players') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('playersTab').style.display = 'grid';
        document.getElementById('staffTab').style.display = 'none';
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('playersTab').style.display = 'none';
        document.getElementById('staffTab').style.display = 'grid';
    }
}

renderCards(players, 'playersTab');
renderCards(staff, 'staffTab');

const hash = window.location.hash.replace('#', '');
if (hash === 'staff') switchTab('staff');
</script>
</body>
</html>
