<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements — Ahudiyannem FC</title>
    <link rel="icon" href="../All Asset/assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Saira:wght@400;500;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a14;
    color: #fff;
    overflow-x: hidden;
}

/* HEADER */
.ach-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(10,10,20,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    padding: 0 5%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.ach-header a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s;
}
.ach-header a:hover { color: #fff; }
.ach-header span {
    font-family: 'Saira', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
}

/* HERO */
.ach-hero {
    margin-top: 60px;
    padding: 80px 5% 60px;
    text-align: center;
    background: linear-gradient(160deg, #1a0a2e 0%, #2d1b69 25%, #4a1a6b 50%, #2d1b69 75%, #1a0a2e 100%);
    position: relative;
    overflow: hidden;
}
.ach-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 100%, rgba(168,85,247,0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 50%, rgba(236,72,153,0.2) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 50%, rgba(139,92,246,0.2) 0%, transparent 40%);
    pointer-events: none;
}
.ach-hero h1 {
    font-family: 'Saira', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 0 60px rgba(255,255,255,0.3), 0 2px 10px rgba(0,0,0,0.3);
    position: relative;
}
.ach-hero p {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.6);
    margin-top: 12px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
}
.ach-hero .trophy-count {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    padding: 6px 20px;
    border-radius: 50px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    font-size: 0.85rem;
    font-weight: 600;
    position: relative;
}
.ach-hero .trophy-count i { color: #fbbf24; }

/* TIMELINE */
.ach-timeline {
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 5% 80px;
    position: relative;
}
.ach-timeline::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: linear-gradient(180deg, transparent, rgba(168,85,247,0.3) 10%, rgba(168,85,247,0.1) 90%, transparent);
    transform: translateX(-50%);
}
.timeline-item {
    display: flex;
    gap: 40px;
    margin-bottom: 60px;
    position: relative;
    align-items: center;
}
.timeline-item:nth-child(odd) { flex-direction: row; }
.timeline-item:nth-child(even) { flex-direction: row-reverse; }
.timeline-item .tl-visual {
    flex: 0 0 200px;
    height: 200px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.timeline-item:hover .tl-visual {
    transform: translateY(-4px);
    box-shadow: 0 12px 48px rgba(168,85,247,0.15);
}
.timeline-item .tl-visual img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: transform 0.4s ease;
}
.timeline-item:hover .tl-visual img { transform: scale(1.1); }
.timeline-item .tl-visual .tl-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    border: 2px solid rgba(0,0,0,0.3);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.tl-badge.gold { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; }
.tl-badge.silver { background: linear-gradient(135deg, #d1d5db, #9ca3af); color: #fff; }
.tl-badge.bronze { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }

.timeline-item .tl-content { flex: 1; min-width: 0; }
.timeline-item .tl-year {
    display: inline-block;
    font-family: 'Saira', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 4px 14px;
    border-radius: 50px;
    background: rgba(168,85,247,0.15);
    color: #c084fc;
    margin-bottom: 10px;
    text-transform: uppercase;
}
.timeline-item .tl-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
}
.timeline-item .tl-medal {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
}
.tl-medal.gold-text { color: #fbbf24; }
.tl-medal.silver-text { color: #d1d5db; }
.tl-medal.bronze-text { color: #cd7f32; }

.timeline-item .tl-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 20px;
    margin-top: 12px;
}
.timeline-item .tl-details .detail-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.timeline-item .tl-details .detail-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
}
.timeline-item .tl-details .detail-value {
    font-size: 0.9rem;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
}
.timeline-item .tl-desc {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.55);
    line-height: 1.7;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.04);
}

/* TIMELINE DOT */
.timeline-item::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c084fc, #7c3aed);
    border: 3px solid #1a0a2e;
    transform: translate(-50%, -50%);
    z-index: 2;
    box-shadow: 0 0 20px rgba(168,85,247,0.3);
}

/* BACK LINK */
.ach-back {
    text-align: center;
    padding: 0 5% 60px;
}
.ach-back a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: color 0.2s;
}
.ach-back a:hover { color: #fff; }

/* RESPONSIVE */
@media (max-width: 768px) {
    .ach-hero h1 { font-size: 2.2rem; letter-spacing: 4px; }
    .ach-hero p { font-size: 0.95rem; }
    .ach-timeline::before { left: 20px; }
    .timeline-item { flex-direction: column !important; gap: 20px; padding-left: 40px; }
    .timeline-item::before { left: 20px; top: 30px; transform: translate(-50%, -50%); }
    .timeline-item .tl-visual { flex: none; width: 100%; max-width: 180px; height: 160px; }
    .timeline-item .tl-name { font-size: 1.3rem; }
    .timeline-item .tl-details { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
    .ach-hero { padding: 60px 15px 40px; }
    .ach-hero h1 { font-size: 1.6rem; letter-spacing: 3px; }
    .ach-timeline { padding: 40px 15px 50px; }
    .timeline-item { padding-left: 30px; margin-bottom: 40px; }
    .timeline-item .tl-visual { max-width: 120px; height: 120px; padding: 20px; }
    .timeline-item .tl-name { font-size: 1.1rem; }
    .timeline-item .tl-year { font-size: 0.7rem; }
    .timeline-item .tl-desc { font-size: 0.8rem; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="ach-header">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <span>Trophy Room</span>
</header>

<!-- HERO -->
<section class="ach-hero">
    <h1>Honour Roll</h1>
    <p>Every trophy tells a story. Relive the moments that defined Ahudiyannem FC.</p>
    <div class="trophy-count"><i class="fas fa-trophy"></i> <span id="trophyTotal">5</span> Major Honours</div>
</section>

<!-- TIMELINE -->
<section class="ach-timeline" id="timelineContainer">
    <!-- Populated by JS -->
</section>

<!-- BACK LINK -->
<div class="ach-back">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
</div>

<script>
var achievements = [
    {
        id: 1,
        name: 'National League',
        year: '2024',
        medal: 'Champions',
        medalClass: 'gold',
        image: '../All Asset/assets/trophy-gold-sm.png',
        opponent: 'Various Teams',
        venue: 'Abia Centre',
        score: '1st Place',
        date: 'December 2024',
        description: 'A dominant campaign saw Ahudiyannem FC clinch the National League title, finishing top of the table with an impressive unbeaten run at home. The squad\'s relentless performance throughout the season cemented their place as one of the top sides in the division.'
    },
    {
        id: 2,
        name: 'Abia FA Cup',
        year: '2025',
        medal: 'Winners',
        medalClass: 'silver',
        image: '../All Asset/assets/trophy-silver-sm.png',
        opponent: 'Various Abia Teams',
        venue: 'Umuahia Township Stadium',
        score: 'Champions',
        date: 'April 2025',
        description: 'Ahudiyannem FC lifted the Abia State FA Cup trophy after a valiant run through the tournament. The team defeated several higher-division opponents to claim the title, showcasing the depth and resilience of the squad.'
    },
    {
        id: 3,
        name: 'Super Cup',
        year: '2024',
        medal: 'Champions',
        medalClass: 'gold',
        image: '../All Asset/assets/trophy-gold-v2-sm.png',
        opponent: 'League Champions',
        venue: 'Umuahia Township Stadium',
        score: '2 - 1',
        date: 'January 2024',
        description: 'A thrilling Super Cup encounter saw Ahudiyannem FC edge past the league champions in a tightly contested match. The victory marked the club\'s first major silverware and set the tone for a historic season.'
    },
    {
        id: 4,
        name: 'State Championship',
        year: '2023',
        medal: 'Gold',
        medalClass: 'gold',
        image: '../All Asset/assets/trophy-gold-v3-sm.png',
        opponent: 'Abia State Teams',
        venue: 'Abia State Sports Complex',
        score: '1st Place',
        date: 'August 2023',
        description: 'Ahudiyannem FC emerged victorious in the Abia State Championship, defeating local rivals in a hard-fought tournament. The gold medal finish was a testament to the club\'s growing stature in Abia State football.'
    },
    {
        id: 5,
        name: 'Presidential Cup',
        year: '2026',
        medal: 'Finalists',
        medalClass: 'bronze',
        image: '../All Asset/assets/trophy-bronze-sm.png',
        opponent: 'Plateau United',
        venue: 'Ubakala Mini Stadium',
        score: '1 - 2',
        date: 'May 2026',
        description: 'Making their President Federation Cup debut, Ahudiyannem FC put up a spirited fight against NPFL side Plateau United in the Round of 64. Despite taking the game to their more experienced opponents and equalising early, the NLO side ultimately fell 2-1. The performance earned the club national recognition.'
    }
];

var container = document.getElementById('timelineContainer');
document.getElementById('trophyTotal').textContent = achievements.length;

achievements.forEach(function(ach, index) {
    var item = document.createElement('div');
    item.className = 'timeline-item';

    item.innerHTML =
        '<div class="tl-visual">' +
            '<div class="tl-badge ' + ach.medalClass + '"><i class="fas fa-trophy"></i></div>' +
            '<img src="' + ach.image + '" alt="' + ach.name + '">' +
        '</div>' +
        '<div class="tl-content">' +
            '<span class="tl-year">' + ach.year + '</span>' +
            '<h2 class="tl-name">' + ach.name + '</h2>' +
            '<div class="tl-medal ' + ach.medalClass + '-text">' + ach.medal + '</div>' +
            '<div class="tl-details">' +
                '<div class="detail-item"><span class="detail-label">Date</span><span class="detail-value">' + ach.date + '</span></div>' +
                '<div class="detail-item"><span class="detail-label">Opponent</span><span class="detail-value">' + ach.opponent + '</span></div>' +
                '<div class="detail-item"><span class="detail-label">Venue</span><span class="detail-value">' + ach.venue + '</span></div>' +
                '<div class="detail-item"><span class="detail-label">Result</span><span class="detail-value">' + ach.score + '</span></div>' +
            '</div>' +
            '<div class="tl-desc">' + ach.description + '</div>' +
        '</div>';

    container.appendChild(item);
});
</script>
</body>
</html>
