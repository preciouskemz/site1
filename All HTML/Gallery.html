<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Ahudiyannem FC</title>
    <link rel="icon" href="../All Asset/assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Saira:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #fff;
    overflow-x: hidden;
}

/* HEADER */
.gal-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    padding: 0 5%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.gal-header a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s;
}
.gal-header a:hover { color: #fff; }
.gal-header span {
    font-family: 'Saira', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
}

/* HERO */
.gal-hero {
    margin-top: 60px;
    padding: 60px 5% 40px;
    text-align: center;
    background: linear-gradient(135deg, #0a0a0a 0%, #0d2818 50%, #0a0a0a 100%);
    position: relative;
    overflow: hidden;
}
.gal-hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(34,197,94,0.04) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(34,197,94,0.03) 0%, transparent 50%);
    pointer-events: none;
}
.gal-hero h1 {
    font-family: 'Saira', sans-serif;
    font-size: 3rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 40px rgba(34,197,94,0.15);
    position: relative;
}
.gal-hero p {
    font-size: 1rem;
    color: rgba(255,255,255,0.5);
    margin-top: 10px;
    position: relative;
}

/* GALLERY GRID */
.gal-grid-wrap {
    max-width: 1300px;
    margin: 0 auto;
    padding: 40px 15px 60px;
}
.gal-grid {
    column-count: 3;
    column-gap: 16px;
}
.gal-item {
    display: inline-block;
    width: 100%;
    margin-bottom: 16px;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.3s ease;
    break-inside: avoid;
}
.gal-item:hover {
    transform: translateY(-3px);
}
.gal-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
    transition: transform 0.5s ease;
}
.gal-item:hover img {
    transform: scale(1.05);
}
.gal-item .gal-overlay {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
}
.gal-item:hover .gal-overlay {
    opacity: 1;
}
.gal-item .gal-overlay .gal-label {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #22c55e;
}
.gal-item .gal-overlay .gal-caption {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.8);
    margin-top: 2px;
}
.gal-item .gal-expand {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.gal-item:hover .gal-expand {
    opacity: 1;
}

/* LIGHTBOX */
.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 30px;
}
.lightbox.active { display: flex; }
.lightbox .lb-close {
    position: absolute;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    font-size: 2.2rem;
    cursor: pointer;
    transition: color 0.2s;
    z-index: 10;
    line-height: 1;
}
.lightbox .lb-close:hover { color: #fff; }
.lightbox .lb-img-wrap {
    max-width: 90vw;
    max-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: lbIn 0.3s ease;
}
@keyframes lbIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.lightbox .lb-img-wrap img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.6);
}
.lightbox .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}
.lightbox .lb-nav:hover { background: rgba(255,255,255,0.12); }
.lightbox .lb-prev { left: 20px; }
.lightbox .lb-next { right: 20px; }
.lightbox .lb-counter {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    font-weight: 500;
    letter-spacing: 1px;
}
.lightbox .lb-caption {
    position: absolute;
    bottom: -56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.6);
}

/* FOOTER */
.gal-footer {
    text-align: center;
    padding: 0 5% 50px;
}
.gal-footer a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s;
}
.gal-footer a:hover { color: #22c55e; }

/* RESPONSIVE */
@media (max-width: 900px) {
    .gal-grid { column-count: 2; }
    .gal-hero h1 { font-size: 2.2rem; }
}
@media (max-width: 500px) {
    .gal-grid { column-count: 2; column-gap: 10px; }
    .gal-item { margin-bottom: 10px; border-radius: 10px; }
    .gal-item img { border-radius: 10px; }
    .gal-item .gal-overlay { display: none; }
    .gal-hero { padding: 50px 15px 30px; }
    .gal-hero h1 { font-size: 1.6rem; letter-spacing: 3px; }
    .gal-grid-wrap { padding: 20px 10px 40px; }
    .lightbox .lb-prev { left: 8px; width: 36px; height: 36px; font-size: 0.9rem; }
    .lightbox .lb-next { right: 8px; width: 36px; height: 36px; font-size: 0.9rem; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="gal-header">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <span>Gallery</span>
</header>

<!-- HERO -->
<section class="gal-hero">
    <h1>Photo Gallery</h1>
    <p>Moments captured from the pitch, the stands, and behind the scenes</p>
</section>

<!-- GRID -->
<section class="gal-grid-wrap">
    <div class="gal-grid" id="galleryGrid">
        <!-- Populated by JS -->
    </div>
</section>

<!-- FOOTER -->
<div class="gal-footer">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Ahudiyannem FC</a>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <button class="lb-close" id="lbClose">&times;</button>
    <button class="lb-nav lb-prev" id="lbPrev"><i class="fas fa-chevron-left"></i></button>
    <div class="lb-img-wrap">
        <img id="lbImg" src="" alt="">
        <span class="lb-counter" id="lbCounter"></span>
        <span class="lb-caption" id="lbCaption"></span>
    </div>
    <button class="lb-nav lb-next" id="lbNext"><i class="fas fa-chevron-right"></i></button>
</div>

<script>
var images = [
    {
        src: '../All Asset/gallery_asset/gallery1.jpg',
        label: 'Training Facility',
        caption: 'High-performance gym equipped with modern training gear'
    },
    {
        src: '../All Asset/gallery_asset/gallery2.jpg',
        label: 'Youth Academy',
        caption: 'Developing the next generation of football talent'
    },
    {
        src: '../All Asset/gallery_asset/gallery3.jpg',
        label: 'Match Analysis',
        caption: 'Tactical review sessions with the coaching crew'
    },
    {
        src: '../All Asset/gallery_asset/gallery4.jpg',
        label: 'Team Training',
        caption: 'Intense drills and tactical exercises on the training ground'
    },
    {
        src: '../All Asset/gallery_asset/gallery5.jpg',
        label: 'Matchday Atmosphere',
        caption: 'The fans — our 12th man in the stands'
    },
    {
        src: '../All Asset/gallery_asset/gallery6.jpg',
        label: 'Celebration',
        caption: 'Trophy celebrations with the entire Ahudiyannem family'
    },
    {
        src: '../All Asset/gallery_asset/gallery7.jpg',
        label: 'Team Huddle',
        caption: 'Pre-match team talk and motivation'
    },
    {
        src: '../All Asset/gallery_asset/gallery8.jpg',
        label: 'Community Outreach',
        caption: 'Giving back to the community that supports us'
    }
];

var grid = document.getElementById('galleryGrid');

images.forEach(function(img, i) {
    var sizes = ['', 'gal-tall', 'gal-wide', 'gal-large'];
    var cls = sizes[i % sizes.length];

    var item = document.createElement('div');
    item.className = 'gal-item' + (cls ? ' ' + cls : '');
    item.setAttribute('data-index', i);

    item.innerHTML =
        '<img src="' + img.src + '" alt="' + img.label + '" loading="lazy">' +
        '<div class="gal-overlay">' +
            '<div class="gal-label">' + img.label + '</div>' +
            '<div class="gal-caption">' + img.caption + '</div>' +
        '</div>' +
        '<div class="gal-expand"><i class="fas fa-expand"></i></div>';

    item.addEventListener('click', function() { openLightbox(i); });
    grid.appendChild(item);
});

// LIGHTBOX
var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbCounter = document.getElementById('lbCounter');
var lbCaption = document.getElementById('lbCaption');
var lbPrev = document.getElementById('lbPrev');
var lbNext = document.getElementById('lbNext');
var currentIndex = 0;

function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function updateLightbox() {
    var img = images[currentIndex];
    lbImg.src = img.src;
    lbImg.alt = img.label;
    lbCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
    lbCaption.textContent = img.label + ' — ' + img.caption;
}

function closeLightbox() {
    lb.classList.remove('active');
    document.body.style.overflow = '';
}

lbPrev.addEventListener('click', function() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateLightbox();
});

lbNext.addEventListener('click', function() {
    currentIndex = (currentIndex + 1) % images.length;
    updateLightbox();
});

document.getElementById('lbClose').addEventListener('click', closeLightbox);

lb.addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
});

document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { currentIndex = (currentIndex - 1 + images.length) % images.length; updateLightbox(); }
    if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % images.length; updateLightbox(); }
});
</script>
</body>
</html>
