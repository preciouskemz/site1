<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Results — Ahudiyannem FC</title>
    <link rel="icon" href="../All Asset/assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
}
.page-header {
    position: relative;
    padding: 60px 5% 40px;
    text-align: center;
    background: linear-gradient(135deg, #0d1a0f 0%, #0a0a0a 50%, #0d0d1a 100%);
    border-bottom: 1px solid rgba(34,197,94,0.15);
}
.page-header h1 {
    font-family: 'Saira', sans-serif;
    font-size: 3.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 40px rgba(34,197,94,0.3);
}
.page-header p {
    color: rgba(255,255,255,0.6);
    margin-top: 10px;
    font-size: 1rem;
}
.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 20px;
    transition: color 0.3s;
}
.back-link:hover { color: #22c55e; }
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 5%;
}
.stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 50px;
}
.stat-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(34,197,94,0.12);
    padding: 30px 20px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
}
.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(34,197,94,0.1);
    border-color: rgba(34,197,94,0.3);
}
.stat-number {
    font-family: 'Saira', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #22c55e;
}
.stat-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
}
.filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
}
.filter-btn {
    padding: 10px 24px;
    border: 1px solid rgba(34,197,94,0.2);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.6);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
}
.filter-btn.active, .filter-btn:hover {
    background: #22c55e;
    color: #fff;
    border-color: #22c55e;
}
.results-table {
    width: 100%;
    border-collapse: collapse;
}
.results-table thead th {
    padding: 14px 16px;
    text-align: left;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-weight: 700;
}
.results-table tbody tr {
    transition: background 0.3s;
}
.results-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.results-table tbody tr:hover { background: rgba(34,197,94,0.06); }
.results-table tbody td {
    padding: 14px 16px;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.8);
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.results-table .score-cell {
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 1px;
}
.result-badge {
    display: inline-block;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
}
.result-badge.win { background: rgba(34,197,94,0.2); color: #22c55e; }
.result-badge.loss { background: rgba(239,68,68,0.2); color: #ef4444; }
.result-badge.draw { background: rgba(234,179,8,0.2); color: #eab308; }
.page-footer {
    text-align: center;
    padding: 40px 5%;
    border-top: 1px solid rgba(255,255,255,0.06);
}
.page-footer a {
    color: #22c55e;
    text-decoration: none;
    font-size: 0.85rem;
}
.page-footer a:hover { text-decoration: underline; }
@media (max-width: 768px) {
    .page-header h1 { font-size: 2rem; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .stat-number { font-size: 2rem; }
    .results-table thead th, .results-table tbody td { padding: 10px 8px; font-size: 0.75rem; }
}
</style>
</head>
<body>

<header class="page-header">
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <h1>Our Results</h1>
    <p>Every match. Every score. Every moment that shaped our journey.</p>
</header>

<div class="container">

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number">27</div>
            <div class="stat-label">Matches Played</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" style="color:#22c55e;">14</div>
            <div class="stat-label">Wins</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" style="color:#eab308;">4</div>
            <div class="stat-label">Draws</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" style="color:#ef4444;">9</div>
            <div class="stat-label">Losses</div>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterResults('all')">All</button>
        <button class="filter-btn" onclick="filterResults('mens')">Men's Team</button>
        <button class="filter-btn" onclick="filterResults('womens')">Queens</button>
        <button class="filter-btn" onclick="filterResults('win')">Wins</button>
    </div>

    <table class="results-table" id="resultsTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>League</th>
                <th>Home</th>
                <th>Score</th>
                <th>Away</th>
                <th>Venue</th>
                <th>Result</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

</div>

<footer class="page-footer">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Ahudiyannem FC</a>
</footer>

<script>
const resultsData = [
    // Men's Results
    { date: '19 May 2026', league: 'Pres. Federation Cup R64', home: 'Ahudiyannem FC', score: '1 - 2', away: 'Plateau United', venue: 'Ubakala Mini Stadium', result: 'loss', team: 'mens' },
    { date: '10 May 2026', league: 'NLO Abia Centre', home: 'Right 2 Win FC', score: '1 - 3', away: 'Ahudiyannem FC', venue: 'Ubakala Mini Stadium', result: 'win', team: 'mens' },
    { date: '03 May 2026', league: 'NLO Abia Centre', home: 'Ahudiyannem FC', score: '2 - 0', away: 'Ozal FA', venue: 'Umuahia Township Stadium', result: 'win', team: 'mens' },
    { date: '27 Apr 2026', league: 'Abia FA Cup Final', home: 'Ahudiyannem FC', score: '0 - 4', away: 'Enyimba FC', venue: 'Umuahia Township Stadium', result: 'loss', team: 'mens' },
    { date: '20 Apr 2026', league: 'NLO Abia Centre', home: 'Hypebuzz FC', score: '0 - 1', away: 'Ahudiyannem FC', venue: 'Ubakala Mini Stadium', result: 'win', team: 'mens' },
    { date: '13 Apr 2026', league: 'NLO Abia Centre', home: 'Ahudiyannem FC', score: '4 - 1', away: 'Lapai FA', venue: 'Umuahia Township Stadium', result: 'win', team: 'mens' },
    { date: '06 Apr 2026', league: 'NLO Abia Centre', home: 'Jnr Danburan FC', score: '1 - 1', away: 'Ahudiyannem FC', venue: 'Ubakala Mini Stadium', result: 'draw', team: 'mens' },
    // Women's Results
    { date: '03 May 2026', league: 'NWFL Premiership', home: 'Ahudiyannem Queens', score: '0 - 2', away: 'Nasarawa Amazons', venue: 'Umuahia Township Stadium', result: 'loss', team: 'womens' },
    { date: '26 Apr 2026', league: 'NWFL Premiership', home: 'Ahudiyannem Queens', score: '3 - 0', away: 'Osun Babes', venue: 'Umuahia Township Stadium', result: 'win', team: 'womens' },
    { date: '19 Apr 2026', league: 'NWFL Premiership', home: 'Sunshine Queens', score: '0 - 1', away: 'Ahudiyannem Queens', venue: 'Akure Township Stadium', result: 'win', team: 'womens' },
    { date: '12 Apr 2026', league: 'NWFL Premiership', home: 'Delta Queens', score: '2 - 1', away: 'Ahudiyannem Queens', venue: 'Stephen Keshi Stadium', result: 'loss', team: 'womens' },
    { date: '05 Apr 2026', league: 'NWFL Premiership', home: 'Remo Stars Ladies', score: '1 - 2', away: 'Ahudiyannem Queens', venue: 'Remo Stars Stadium', result: 'win', team: 'womens' },
    { date: '29 Mar 2026', league: 'NWFL Premiership', home: 'Ahudiyannem Queens', score: '0 - 0', away: 'Sunshine Queens', venue: 'Umuahia Township Stadium', result: 'draw', team: 'womens' },
    { date: '22 Mar 2026', league: 'NWFL Premiership', home: 'Ahudiyannem Queens', score: '2 - 1', away: 'Royal Queens', venue: 'Umuahia Township Stadium', result: 'win', team: 'womens' },
];

function renderResults(data) {
    const tbody = document.getElementById('resultsBody');
    tbody.innerHTML = data.map(m => `
        <tr>
            <td>${m.date}</td>
            <td>${m.league}</td>
            <td style="font-weight:${m.home.includes('Ahudiyannem') ? '700' : '400'}; color:${m.home.includes('Ahudiyannem') ? '#22c55e' : 'rgba(255,255,255,0.8)'}">${m.home}</td>
            <td class="score-cell">${m.score}</td>
            <td style="font-weight:${m.away.includes('Ahudiyannem') ? '700' : '400'}; color:${m.away.includes('Ahudiyannem') ? '#22c55e' : 'rgba(255,255,255,0.8)'}">${m.away}</td>
            <td>${m.venue}</td>
            <td><span class="result-badge ${m.result}">${m.result === 'win' ? 'W' : m.result === 'loss' ? 'L' : 'D'}</span></td>
        </tr>
    `).join('');
}

function filterResults(filter) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    let filtered = resultsData;
    if (filter === 'mens') filtered = resultsData.filter(m => m.team === 'mens');
    else if (filter === 'womens') filtered = resultsData.filter(m => m.team === 'womens');
    else if (filter === 'win') filtered = resultsData.filter(m => m.result === 'win');
    renderResults(filtered);
}

renderResults(resultsData);
</script>

</body>
</html>
