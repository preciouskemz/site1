<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News — Ahudiyannem FC</title>
    <link rel="icon" href="../All Asset/assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Saira:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: #fff;
    color: #111;
    overflow-x: hidden;
}
.news-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 0 5%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.news-header a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(0,0,0,0.5);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s;
}
.news-header a:hover { color: #111; }
.news-header span {
    font-family: 'Saira', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: rgba(0,0,0,0.2);
    text-transform: uppercase;
}
.news-hero {
    margin-top: 60px;
    padding: 80px 5% 50px;
    text-align: center;
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #f8f9fa 100%);
    position: relative;
    border-bottom: 1px solid rgba(0,0,0,0.04);
}
.news-hero h1 {
    font-family: 'Saira', sans-serif;
    font-size: 3.2rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #111;
}
.news-hero p {
    font-size: 1rem;
    color: #666;
    margin-top: 10px;
}
.news-meta {
    font-size: 0.85rem;
    color: #888;
    margin-top: 14px;
}
.news-meta span { display: inline-flex; align-items: center; gap: 6px; }
.section-wrap {
    max-width: 1300px;
    margin: 0 auto;
    padding: 60px 20px 80px;
}
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
}
.news-card {
    background: #ffffff;
    border: 1px solid #eef0f2;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
}
.news-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    background: #111111;
    border-color: #222;
}
.news-card:hover .card-title { color: #ffffff; }
.news-card:hover .card-text { color: #cccccc; }
.news-card:hover .card-footer { color: #888888; border-top-color: #333; }
.news-card .image-container {
    position: relative;
    width: 100%;
    height: 320px;
    overflow: hidden;
}
.news-card .image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    transition: transform 0.4s ease;
}
.news-card:hover .image-container img { transform: scale(0.92); }
.badge {
    position: absolute;
    top: 15px;
    right: 15px;
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    letter-spacing: 0.5px;
}
.badge-highlights { background-color: #ff3344; }
.card-content {
    padding: 25px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}
.card-title {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.3;
    color: #111111;
    margin: 0 0 15px 0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}
.card-text {
    font-size: 14px;
    line-height: 1.6;
    color: #666666;
    margin: 0 0 25px 0;
    flex-grow: 1;
}
.card-footer {
    font-size: 12px;
    color: #999999;
    border-top: 1px solid #f0f0f0;
    padding-top: 15px;
}
.news-footer {
    text-align: center;
    padding: 0 5% 60px;
}
.news-footer a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(0,0,0,0.4);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s;
}
.news-footer a:hover { color: #22c55e; }

/* MODAL */
.news-modal {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: #0a0a0a;
    overflow-y: auto;
    z-index: 99999;
    display: none;
    padding: 0;
}
.news-modal.active { display: block; }
body.modal-open { overflow: hidden; }
.modal-close {
    position: fixed;
    top: 20px; right: 40px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    width: 50px; height: 50px;
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 1002;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
}
.modal-close:hover { background: rgba(255,255,255,0.3); transform: scale(1.1); }
.modal-content {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    color: white;
    z-index: 1;
    padding: 100px 40px;
    animation: modalIn 0.4s ease;
}
@keyframes modalIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
.modal-content img {
    width: 100%;
    height: auto;
    border-radius: 0;
    margin-bottom: 30px;
    max-height: 500px;
    object-fit: cover;
}
.modal-content .modal-date {
    font-size: 0.95rem;
    opacity: 0.9;
    margin-bottom: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.9);
}
.modal-content .modal-badge {
    display: inline-block;
    background: #ff3344;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
}
.modal-content .modal-title {
    color: white;
    font-size: 2.5rem;
    margin-bottom: 10px;
    line-height: 1.2;
    font-weight: 700;
}
.modal-content .modal-highlight {
    color: #86efac;
    font-size: 1.2rem;
    margin-bottom: 25px;
    font-style: italic;
}
.modal-content .modal-text {
    color: rgba(255,255,255,0.95);
    line-height: 1.9;
    font-size: 1.1rem;
}

@media (max-width: 768px) {
    .news-hero h1 { font-size: 2rem; }
    .card-grid { grid-template-columns: 1fr; gap: 20px; }
    .section-wrap { padding: 40px 15px 60px; }
    .modal-content { padding: 80px 20px; }
    .modal-content .modal-title { font-size: 1.6rem; }
    .modal-close { top: 14px; right: 14px; width: 40px; height: 40px; font-size: 20px; }
}
</style>
</head>
<body>

<header class="news-header">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    <span>News</span>
</header>

<section class="news-hero">
    <h1>Latest News</h1>
    <p>Stay up to date with everything happening at Ahudiyannem FC</p>
    <div class="news-meta"><span><i class="far fa-newspaper"></i> 6 articles</span></div>
</section>

<section class="section-wrap">
    <div class="card-grid" id="newsGrid">
        <!-- Populated by JS -->
    </div>
</section>

<div class="news-footer">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Ahudiyannem FC</a>
</div>

<div class="news-modal" id="newsModal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
var news = [
    {
        id: 1,
        title: "Ahudiyannem FC Battles Hard in Federation Cup Debut",
        date: "19/05/2026",
        image: "../All Asset/news_asset/news1.jpg",
        highlight: "Ahudiyannem FC fall 1-2 to Plateau United in President Federation Cup Round of 64",
        badge: "MATCH HIGHLIGHTS",
        content: "Ahudiyannem FC made their President Federation Cup debut, falling 1-2 to NPFL side Plateau United in the Round of 64 at Ubakala Mini Stadium. The NLO side showed tremendous spirit, taking the game to their more experienced opponents. After going behind early, Ahudiyannem equalized through a well-worked counter-attack. However, Plateau United's quality told in the second half as they scored the winner. Despite the defeat, the club earned respect nationwide for their fearless performance against top-flight opposition.",
        shortText: "Ahudiyannem FC made their President Federation Cup debut, falling 1-2 to NPFL side Plateau United in the Round of 64 at Ubakala Mini Stadium.",
        shortTitle: "Ahudiyannem FC fall 1-2 to Plateau United in Federation Cup"
    },
    {
        id: 2,
        title: "NLO 2026 Season Kicks Off with Victory",
        date: "10/04/2026",
        image: "../All Asset/news_asset/news2.jpg",
        highlight: "Ahudiyannem FC begin NLO campaign with impressive away win",
        badge: "MATCH HIGHLIGHTS",
        content: "The 2026 NLO season kicked off with Ahudiyannem FC securing a vital away victory. The team has been training intensively under the coaching staff, focusing on a possession-based style of play. With a blend of experienced campaigners and exciting young talents, the club aims to challenge for the Abia Centre title this season.",
        shortText: "The 2026 NLO season kicked off with Ahudiyannem FC securing a vital away victory. The team has been training intensively under the coaching staff.",
        shortTitle: "NLO 2026 season begins with away victory"
    },
    {
        id: 3,
        title: "Ahudiyannem Queens Dominate Osun Babes",
        date: "26/04/2026",
        image: "../All Asset/news_asset/news3.jpg",
        highlight: "Grace Aaron brace powers Queens to commanding 3-0 home victory",
        badge: "INTERVIEWS",
        content: "Ahudiyannem Queens produced a dominant display at Umuahia Township Stadium, thrashing Osun Babes 3-0 in the NWFL Premiership. Star forward Grace Aaron was the standout performer, netting a brilliant brace that showcased her clinical finishing ability.",
        shortText: "Ahudiyannem Queens produced a dominant display at Umuahia Township Stadium, thrashing Osun Babes 3-0 in the NWFL Premiership.",
        shortTitle: "Grace Aaron brace powers Queens to 3-0 victory"
    },
    {
        id: 4,
        title: "Ahudiyannem Reach Abia State FA Cup Final",
        date: "27/04/2026",
        image: "../All Asset/news_asset/news4.jpg",
        highlight: "Ahudiyannem FC finish runners-up in Abia State FA Cup after valiant run",
        badge: "MATCH HIGHLIGHTS",
        content: "Ahudiyannem FC's remarkable run in the Abia State FA Cup ended in the final with a 4-0 defeat to NPFL giants Enyimba FC at Umuahia Township Stadium. The journey to the final was nothing short of extraordinary, with the club defeating several higher-division opponents along the way.",
        shortText: "Ahudiyannem FC's remarkable run in the Abia State FA Cup ended in the final with a 4-0 defeat to NPFL giants Enyimba FC.",
        shortTitle: "Ahudiyannem finish runners-up in Abia State FA Cup"
    },
    {
        id: 5,
        title: "Queens Finish Fourth in NWFL Group B",
        date: "06/05/2026",
        image: "../All Asset/news_asset/news5.jpg",
        highlight: "Ahudiyannem Queens secure 4th place in NWFL Premiership Group B with 25 points",
        badge: "INTERVIEWS",
        content: "Ahudiyannem Queens concluded their debut NWFL Premiership season with a solid 4th-place finish in Group B, amassing 25 points from 18 matches. The Queens recorded 7 wins, 4 draws, and 7 losses, with notable victories including a 5-1 demolition of Confluence Queens.",
        shortText: "Ahudiyannem Queens concluded their debut NWFL Premiership season with a solid 4th-place finish in Group B, amassing 25 points from 18 matches.",
        shortTitle: "Queens finish 4th in NWFL Premiership Group B"
    },
    {
        id: 6,
        title: "Ahudiyannem Queens Secure Away Win at Sunshine",
        date: "19/04/2026",
        image: "../All Asset/news_asset/news6.jpg",
        highlight: "Ahudiyannem Queens claim vital away victory at Sunshine Queens",
        badge: "MATCH HIGHLIGHTS",
        content: "Ahudiyannem Queens secured a crucial 1-0 away victory against Sunshine Queens at the Akure Township Stadium. The solitary goal was enough to earn all three points as the Queens displayed impressive defensive organization and composure on the road.",
        shortText: "Ahudiyannem Queens secured a crucial 1-0 away victory against Sunshine Queens at the Akure Township Stadium.",
        shortTitle: "Queens secure vital away victory at Sunshine Queens"
    }
];

var grid = document.getElementById('newsGrid');

news.forEach(function(item) {
    var card = document.createElement('article');
    card.className = 'news-card';
    card.setAttribute('data-id', item.id);
    card.innerHTML =
        '<div class="image-container">' +
            '<img src="' + item.image + '" alt="' + item.title + '" loading="lazy">' +
            '<span class="badge badge-highlights">' + item.badge + '</span>' +
        '</div>' +
        '<div class="card-content">' +
            '<h3 class="card-title">' + item.shortTitle + '</h3>' +
            '<p class="card-text">' + item.shortText + '</p>' +
            '<div class="card-footer">' + item.date + '</div>' +
        '</div>';
    card.addEventListener('click', function() { openModal(item); });
    grid.appendChild(card);
});

function openModal(item) {
    var modal = document.getElementById('newsModal');
    var content = document.getElementById('modalContent');
    content.innerHTML =
        '<img src="' + item.image + '" alt="' + item.title + '">' +
        '<span class="modal-date">' + item.date + '</span>' +
        '<span class="modal-badge">' + item.badge + '</span>' +
        '<h2 class="modal-title">' + item.title + '</h2>' +
        '<p class="modal-highlight">' + item.highlight + '</p>' +
        '<p class="modal-text">' + item.content + '</p>';
    modal.classList.add('active');
    document.body.classList.add('modal-open');
}

function closeModal() {
    var modal = document.getElementById('newsModal');
    modal.classList.remove('active');
    document.body.classList.remove('modal-open');
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var modal = document.getElementById('newsModal');
        if (modal.classList.contains('active')) closeModal();
    }
});
</script>
</body>
</html>
